version: 2.1

orbs:
  android: circleci/android@2.5.0

jobs:
  build-and-test:
    docker:
      - image: cimg/android:2024.01.1
    resource_class: large
    environment:
      JVM_OPTS: -Xmx3072m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
      _JAVA_OPTIONS: "-Xmx3072m"
    steps:
      - checkout
      
      - run:
          name: Chmod permissions
          command: chmod +x ./gradlew
      
      - restore_cache:
          keys:
            - gradle-cache-v1-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}
            - gradle-cache-v1-
      
      - run:
          name: Download Dependencies
          command: ./gradlew androidDependencies --no-daemon
      
      - save_cache:
          key: gradle-cache-v1-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      
      - run:
          name: Run Lint
          command: ./gradlew lint --no-daemon
      
      - run:
          name: Run Tests
          command: ./gradlew test --no-daemon
      
      - run:
          name: Build Debug APK
          command: ./gradlew assembleDebug --no-daemon --stacktrace
      
      - run:
          name: Build Release APK (optional)
          command: |
            # Skip release build if it causes memory issues
            # ./gradlew assembleRelease --no-daemon --stacktrace
            echo "Skipping release build to save memory"
      
      - store_test_results:
          path: app/build/test-results
      
      - store_test_results:
          path: core/build/test-results
      
      - store_artifacts:
          path: app/build/reports
          destination: app-reports
      
      - store_artifacts:
          path: core/build/reports
          destination: core-reports
      
      - store_artifacts:
          path: app/build/outputs/apk/debug/
          destination: apk

workflows:
  version: 2
  build-test-workflow:
    jobs:
      - build-and-test
